<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fennec Finance</title>
  <style>
    :root { --bg: #fbfaf7; --fg: #1c1b19; --muted: #6b6860; --accent: #c8742c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #f1efe9; --muted: #a29f96; --accent: #e09a55; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; max-width: 32rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Fennec <span>Finance</span></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
