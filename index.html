<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fennec Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#17304F; --ink-2:#3B5272; --paper:#F6F5F1; --card:#FFFFFF; --line:#E4E2DB; --muted:#7A7F88;
  --sand:#C9A96E; --sand-2:#EFE6D3; --in:#2A7A46; --in-2:#E3F1E7; --out:#B3382B; --out-2:#F7E4E1; --amber:#FFF0C7;
  --side:#17304F; --r:10px; --nav-h:60px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E9EEF5; --ink-2:#B9C5D6; --paper:#141A23; --card:#1C2430; --line:#2B3542; --muted:#8C97A6;
  --sand:#D4B47C; --sand-2:#2E2A20; --in:#6FCB8B; --in-2:#1E3326; --out:#F08A7D; --out-2:#3A2321; --amber:#3A3320; --side:#0E141C;
}}
:root[data-theme="dark"]{
  --ink:#E9EEF5; --ink-2:#B9C5D6; --paper:#141A23; --card:#1C2430; --line:#2B3542; --muted:#8C97A6;
  --sand:#D4B47C; --sand-2:#2E2A20; --in:#6FCB8B; --in-2:#1E3326; --out:#F08A7D; --out-2:#3A2321; --amber:#3A3320; --side:#0E141C;
}
*{box-sizing:border-box} html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0 0 4px 6px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.65;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav button{background:none;border:0;text-align:left;padding:10px 10px;border-radius:8px;color:rgba(255,255,255,.78);cursor:pointer;display:flex;gap:10px;align-items:center}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}
.nav button:hover{color:#fff}
.side .spacer{flex:1}
.side .status{font-size:12px;opacity:.7;margin-left:6px}
.main{padding:28px 32px 100px;max-width:1120px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:26px;margin:0;letter-spacing:-.01em;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:600;color:var(--ink-2)}
.tabbar{display:none}

/* primary action */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--sand);color:#1E1A10;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;display:flex;gap:8px;align-items:center;z-index:30}
.fab svg{width:18px;height:18px}

/* cards & tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .l{font-size:12px;color:var(--muted);margin-bottom:2px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi.net{background:var(--sand-2);border-color:transparent}
.kpi.neg .v{color:var(--out)}
.two{grid-template-columns:3fr 2fr}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--line)}
.pill.Active,.pill.Paid,.pill.Delivered{background:var(--in-2);color:var(--in)}
.pill.Pitching,.pill.Sent,.pill.Draft{background:var(--amber)}
.pill.Overdue{background:var(--out-2);color:var(--out)}
.in{color:var(--in);font-weight:600} .out{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--sand)}
.bar.over i{background:var(--out)}
.rowbtn{cursor:pointer} .rowbtn:hover td{background:rgba(0,0,0,.025)}
.empty{color:var(--muted);padding:22px 8px;text-align:center}
.muted{color:var(--muted)} .small{font-size:12px}

/* ledger list (transactions) */
.day{margin-top:18px}
.day h3{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0} .tx:hover{background:rgba(0,0,0,.025)}
.tx .t{font-weight:500;grid-column:1;grid-row:1} .tx .s{font-size:12px;color:var(--muted);grid-column:1;grid-row:2}
.tx .a{text-align:right;font-weight:600;grid-column:2;grid-row:1/3;align-self:center}
.tx .a small{display:block;font-weight:400;color:var(--muted);font-size:11px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);background:var(--card);border-radius:8px}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.danger{color:var(--out)}
.btn:disabled{opacity:.5;cursor:default}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{padding:10px 11px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:15px;width:100%}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on.In{background:var(--in-2);color:var(--in)} .seg button.on.Out{background:var(--out-2);color:var(--out)}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:6px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;z-index:40}
.scrim.open{display:block}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 48px);overflow:auto;background:var(--card);border-radius:14px;padding:20px;z-index:50;display:none}
.sheet.open{display:block}
body.locked{overflow:hidden}
body.locked .fab{display:none}
.sheet .actions{position:sticky;bottom:-20px;margin:8px -20px -20px;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.statement{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero .l{font-size:14px;color:var(--muted)}
.hero .v{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:2px 0 6px}
.hero .v small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.hero .v.neg{color:var(--out)}
.hero .sub{color:var(--muted);font-size:14px}
.hero .sub b{color:var(--ink);font-weight:600}
.facts{margin:4px 0 0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts li:first-child{border-top:1px solid var(--line)}
.facts li b{font-weight:600}
.facts li i{font-style:normal;font-size:12px;color:var(--out);margin-left:8px}
.section{margin-bottom:26px}
.section h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;color:var(--ink);margin-bottom:6px}
.section h2 span{font-size:13px;color:var(--muted);font-weight:400}
.dept{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.dept:last-child{border-bottom:0}
.dept .bar{grid-column:1/-1;height:4px;margin-top:4px}
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1.6fr 100px 110px 1fr;gap:4px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0} .prow:hover{background:rgba(0,0,0,.025)}
.prow .n{font-weight:500} .prow .c{font-size:12px;color:var(--muted)}
.prow .m{font-size:13px;color:var(--muted);text-align:right}
.prow .m b{color:var(--ink);font-weight:600}
.irow{display:grid;grid-template-columns:1.4fr 1fr 110px 100px;gap:4px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.irow:last-child{border-bottom:0} .irow:hover{background:rgba(0,0,0,.025)}
details.card{padding:0} details.card summary{padding:14px 18px;cursor:pointer;font-weight:600;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:"+";color:var(--muted)} details.card[open] summary::after{content:"–"}
details.card .inner{padding:0 18px 16px}
.sheet h2{color:var(--ink);font-size:18px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.note{background:var(--sand-2);border-radius:var(--r);padding:12px 14px;font-size:14px}
code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:13px}

/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:20px}
.auth .card{width:min(380px,100%)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px calc(var(--nav-h) + 90px)}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
  .two{grid-template-columns:1fr}
  .statement{grid-template-columns:1fr;gap:18px}
  .hero .v{font-size:44px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:30}
  .tabbar button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:8px;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--ink)}
  .fab{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));padding:14px 16px}
  .prow{grid-template-columns:1fr auto;padding:12px 0}
  .prow .bar{grid-column:1/-1} .prow .m{grid-column:1/-1;text-align:left}
  .irow{grid-template-columns:1fr auto} .irow .d{grid-column:1/-1;font-size:12px;color:var(--muted)}
  .filters{position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:5}
  .fab span{display:none}
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .f .row3{grid-template-columns:1fr 1fr 1fr}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Fennec Finance — single-file app.
   Data layer: Supabase when configured (Settings), otherwise an
   in-memory demo so the UI can be explored before connecting.
   ============================================================ */
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
  cog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>'
};
const STATUS = ['Pitching','Active','Delivered','Closed'];
const INV_STATUS = ['Draft','Sent','Paid','Cancelled'];
const METHODS = ['Cash','Bank Transfer','Cheque','Card'];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2));
const today = () => new Date().toISOString().slice(0,10);
const fmt = n => { n = Number(n||0); const s = Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0}); return n<0?`−${s}`:s; };
const fmtD = d => d ? new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };

/* ---------- demo data (used until Supabase is connected) ---------- */
function demoData(){
  const p1=uid(), p2=uid(), p3=uid(), i1=uid(), i2=uid();
  return {
    projects:[
      {id:p1,name:'Desert Roads — LPC Brand Film',client:'Libya Petroleum Co.',status:'Active',budget:85000,notes:'Delivery mid-Nov'},
      {id:p2,name:'Tripoli Nights — Music Video',client:'Ahmed Fakroun',status:'Active',budget:22000,notes:''},
      {id:p3,name:'Sea of Sand — Documentary',client:'Al-Mukhtar Foundation',status:'Pitching',budget:140000,notes:'Awaiting contract'},
    ],
    invoices:[
      {id:i1,number:'INV-001',project_id:p1,client:'Libya Petroleum Co.',issued:'2026-09-01',due:'2026-09-15',amount:42500,status:'Paid'},
      {id:i2,number:'INV-002',project_id:p2,client:'Ahmed Fakroun',issued:'2026-09-10',due:'2026-09-25',amount:11000,status:'Paid'},
      {id:uid(),number:'INV-003',project_id:p1,client:'Libya Petroleum Co.',issued:'2026-09-28',due:'2026-10-12',amount:42500,status:'Sent'},
    ],
    transactions:[
      {id:uid(),date:'2026-09-03',project_id:p1,direction:'In',category:'Deposit / Advance',payee:'Libya Petroleum Co.',description:'50% advance',amount:42500,currency:'LYD',fx_rate:1,method:'Bank Transfer',invoice_id:i1},
      {id:uid(),date:'2026-09-05',project_id:p1,direction:'Out',category:'Equipment',payee:'Tripoli Camera House',description:'Alexa Mini + lenses, 5 days',amount:6500,currency:'LYD',fx_rate:1,method:'Bank Transfer',receipt:'RC-1001'},
      {id:uid(),date:'2026-09-08',project_id:p1,direction:'Out',category:'Crew & Talent',payee:'Ahmed Al-Mansouri',description:'DOP × 5 days',amount:2250,currency:'LYD',fx_rate:1,method:'Cash',receipt:'RC-1002'},
      {id:uid(),date:'2026-09-09',project_id:p1,direction:'Out',category:'Locations & Permits',payee:'Petty Cash',description:'Ghadames filming permit',amount:1800,currency:'LYD',fx_rate:1,method:'Cash'},
      {id:uid(),date:'2026-09-12',project_id:p1,direction:'Out',category:'Transport & Fuel',payee:'Petty Cash',description:'Fuel + 4×4 hire',amount:3200,currency:'LYD',fx_rate:1,method:'Cash'},
      {id:uid(),date:'2026-09-15',project_id:p2,direction:'Out',category:'Post-Production',payee:'Mediterranean Post',description:'Offline edit',amount:1500,currency:'USD',fx_rate:6.85,method:'Bank Transfer'},
      {id:uid(),date:'2026-09-18',project_id:p2,direction:'In',category:'Client Payment',payee:'Ahmed Fakroun',description:'Final payment',amount:11000,currency:'LYD',fx_rate:1,method:'Cash',invoice_id:i2},
      {id:uid(),date:'2026-09-22',project_id:p2,direction:'Out',category:'Post-Production',payee:'Mediterranean Post',description:'Grade + online',amount:800,currency:'EUR',fx_rate:7.4,method:'Bank Transfer'},
      {id:uid(),date:'2026-09-30',project_id:p1,direction:'Out',category:'Catering & Accommodation',payee:'Petty Cash',description:'Crew meals, 5 days',amount:1250,currency:'LYD',fx_rate:1,method:'Cash'},
    ],
    settings:{
      fx_rates:{LYD:1,USD:6.85,EUR:7.40},
      categories:[
        {name:'Crew & Talent',direction:'Out',department:'Production'},{name:'Equipment',direction:'Out',department:'Production'},
        {name:'Locations & Permits',direction:'Out',department:'Production'},{name:'Transport & Fuel',direction:'Out',department:'Production'},
        {name:'Catering & Accommodation',direction:'Out',department:'Production'},{name:'Travel',direction:'Out',department:'Production'},
        {name:'Post-Production',direction:'Out',department:'Post'},{name:'Office & Admin',direction:'Out',department:'Overhead'},
        {name:'Marketing',direction:'Out',department:'Overhead'},{name:'Bank & FX Fees',direction:'Out',department:'Overhead'},
        {name:'Other Expense',direction:'Out',department:'Overhead'},{name:'Client Payment',direction:'In',department:'Revenue'},
        {name:'Deposit / Advance',direction:'In',department:'Revenue'},{name:'Grant / Sponsorship',direction:'In',department:'Revenue'},
        {name:'Other Income',direction:'In',department:'Revenue'}],
      payees:['Petty Cash','Tripoli Camera House','Ahmed Al-Mansouri','Mediterranean Post','Libya Petroleum Co.','Ahmed Fakroun']
    }
  };
}

/* ---------- data layer ---------- */
const DemoDB = {
  mode:'demo', data:null,
  async init(){ this.data = demoData(); },
  async all(){ const d=this.data; return {projects:[...d.projects],invoices:[...d.invoices],transactions:[...d.transactions],settings:JSON.parse(JSON.stringify(d.settings))}; },
  async upsert(t,row){ const arr=this.data[t]; const i=arr.findIndex(x=>x.id===row.id); if(i>=0) arr[i]={...arr[i],...row}; else arr.push({...row,id:row.id||uid()}); },
  async remove(t,id){ this.data[t]=this.data[t].filter(x=>x.id!==id); },
  async saveSetting(k,v){ this.data.settings[k]=v; },
  async signOut(){}
};
function SupaDB(url,key){
  const sb = window.supabase.createClient(url,key);
  return {
    mode:'supabase', sb,
    async session(){ const {data}=await sb.auth.getSession(); return data.session; },
    async signIn(email,password){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; },
    async signOut(){ await sb.auth.signOut(); },
    async all(){
      const [p,i,t,s] = await Promise.all([
        sb.from('projects').select('*').order('created_at'),
        sb.from('invoices').select('*').order('issued',{ascending:false}),
        sb.from('transactions').select('*').order('date',{ascending:false}).order('created_at',{ascending:false}),
        sb.from('settings').select('*')]);
      for(const r of [p,i,t,s]) if(r.error) throw r.error;
      const settings={}; for(const row of s.data) settings[row.key]=row.value;
      return {projects:p.data,invoices:i.data,transactions:t.data,settings};
    },
    async upsert(t,row){ const r={...row}; delete r.amount_lyd; if(!r.id) delete r.id; const {error}=await sb.from(t).upsert(r); if(error) throw error; },
    async remove(t,id){ const {error}=await sb.from(t).delete().eq('id',id); if(error) throw error; },
    async saveSetting(k,v){ const {error}=await sb.from('settings').upsert({key:k,value:v,updated_at:new Date().toISOString()}); if(error) throw error; }
  };
}

let DB, D = null, page = 'home', txFilter = {project:'',dir:'',q:''};

const app = $('#app');
const amountLYD = t => Number(t.amount_lyd ?? (t.amount * (t.fx_rate||1)));
const projName = id => (D.projects.find(p=>p.id===id)||{}).name || '—';
const dept = cat => (D.settings.categories.find(c=>c.name===cat)||{}).department || 'Other';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

async function boot(){
  const url=store.get('sb_url'), key=store.get('sb_key');
  if(url && key && window.supabase){ DB = SupaDB(url,key); }
  else { DB = DemoDB; await DB.init(); }
  if(DB.mode==='supabase'){
    const s = await DB.session().catch(()=>null);
    if(!s){ renderAuth(); return; }
  }
  await reload();
}
async function reload(){
  try{ D = await DB.all(); render(); }
  catch(e){ renderError(e); }
}

/* ---------- derived numbers ---------- */
function stats(){
  const tx=D.transactions;
  const sum=(f)=>tx.filter(f).reduce((a,t)=>a+amountLYD(t),0);
  const inc=sum(t=>t.direction==='In'), exp=sum(t=>t.direction==='Out');
  const cash=sum(t=>t.direction==='In'&&t.method==='Cash')-sum(t=>t.direction==='Out'&&t.method==='Cash');
  const bank=sum(t=>t.direction==='In'&&t.method==='Bank Transfer')-sum(t=>t.direction==='Out'&&t.method==='Bank Transfer');
  const paidFor=id=>sum(t=>t.direction==='In'&&t.invoice_id===id);
  const inv=D.invoices.map(i=>({...i,paid:paidFor(i.id),balance:i.status==='Cancelled'?0:Number(i.amount)-paidFor(i.id),overdue:i.status==='Sent'&&i.due&&i.due<today()}));
  const outstanding=inv.filter(i=>i.status==='Sent').reduce((a,i)=>a+i.balance,0);
  const overdue=inv.filter(i=>i.overdue).length;
  const projects=D.projects.map(p=>{const spent=sum(t=>t.direction==='Out'&&t.project_id===p.id), coll=sum(t=>t.direction==='In'&&t.project_id===p.id);
    return {...p,spent,collected:coll,remaining:Number(p.budget)-spent,used:p.budget>0?spent/Number(p.budget):0,net:coll-spent};});
  const depts={}; tx.filter(t=>t.direction==='Out').forEach(t=>{const d=dept(t.category); depts[d]=(depts[d]||0)+amountLYD(t);});
  return {inc,exp,net:inc-exp,cash,bank,outstanding,overdue,inv,projects,depts,active:D.projects.filter(p=>p.status==='Active').length};
}

  const nav=cls=>items.map(([k,l,ic])=>`<button class="${page===k?'on':''}" data-nav="${k}">${ic}<span>${l}</span></button>`).join('');
  app.innerHTML=`<div class="shell">
    <aside class="side"><div class="brand">Fennec<small>Production finance</small></div><nav class="nav">${nav()}</nav>
      <div class="spacer"></div><div class="status">${DB.mode==='demo'?'Sample data':'Live'}</div></aside>
    <main class="main">${content}</main></div>
    <nav class="tabbar">${nav()}</nav>
    <button class="fab" id="fab">${ICONS.plus}<span>Add entry</span></button>`;
  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render();window.scrollTo(0,0);});
  $('#fab').onclick=()=>openTx();
}

  const s=stats();

  shell(views[page](s));
  bind(s);
}

  $('#t-save').onclick=async()=>{
    const amt=Number($('#t-amt').value); if(!amt) return toast('Enter an amount');
    const row={id:t.id,date:$('#t-date').value,direction:dir,amount:amt,currency:$('#t-cur').value,fx_rate:Number($('#t-fx').value)||1,method:$('#t-method').value,
      project_id:$('#t-proj').value||null,category:$('#t-cat').value,payee:$('#t-payee').value.trim()||null,description:$('#t-desc').value.trim()||null,receipt:$('#t-rec').value.trim()||null,invoice_id:$('#t-inv').value||null};
    closeSheet(); await save(()=>DB.upsert('transactions',row),edit?'Saved':'Entry added');
  };
  if(edit) $('#t-del').onclick=async()=>{ if(confirm('Delete this entry?')){ closeSheet(); await save(()=>DB.remove('transactions',t.id),'Deleted'); } };
}
function openProject(p){
  const edit=!!p; p=p||{status:'Active',budget:''};
  openSheet(`<h2>${edit?'Edit project':'New project'}</h2><div class="f">
    <label>Project name<input id="p-name" value="${esc(p.name||'')}" placeholder="e.g. Desert Roads — brand film"></label>
    <label>Client<input id="p-client" value="${esc(p.client||'')}"></label>
    <div class="row"><label>Status<select id="p-status">${STATUS.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Budget (LYD)<input id="p-budget" type="number" inputmode="decimal" value="${p.budget}"></label></div>
    <label>Notes<textarea id="p-notes" rows="2">${esc(p.notes||'')}</textarea></label>
    <div class="actions">${edit?'<button class="btn danger" id="p-del">Delete</button>':'<span></span>'}<span><button class="btn" id="p-cancel">Cancel</button> <button class="btn primary" id="p-save">${edit?'Save changes':'Create project'}</button></span></div></div>`);
  $('#p-cancel').onclick=closeSheet;
  $('#p-save').onclick=async()=>{ const name=$('#p-name').value.trim(); if(!name) return toast('Give the project a name');
    const row={id:p.id,name,client:$('#p-client').value.trim()||null,status:$('#p-status').value,budget:Number($('#p-budget').value)||0,notes:$('#p-notes').value.trim()||null};
    closeSheet(); await save(()=>DB.upsert('projects',row),edit?'Saved':'Project created'); };
  if(edit) $('#p-del').onclick=async()=>{ if(confirm('Delete this project? Its transactions stay but lose the link.')){ closeSheet(); await save(()=>DB.remove('projects',p.id),'Deleted'); } };
}
function openInvoice(i){
  const edit=!!i; const next='INV-'+String(D.invoices.length+1).padStart(3,'0');
  i=i||{number:next,issued:today(),due:'',status:'Draft',amount:'',project_id:D.projects[0]?.id||''};
  openSheet(`<h2>${edit?'Edit invoice':'New invoice'}</h2><div class="f">
    <div class="row"><label>Invoice number<input id="i-num" value="${esc(i.number)}"></label><label>Status<select id="i-status">${INV_STATUS.map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
    <label>Project<select id="i-proj">${D.projects.map(p=>`<option value="${p.id}" ${i.project_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label>Client<input id="i-client" value="${esc(i.client||'')}"></label>
    <div class="row3"><label>Amount (LYD)<input id="i-amt" type="number" inputmode="decimal" value="${i.amount}"></label><label>Issued<input id="i-issued" type="date" value="${i.issued||''}"></label><label>Due<input id="i-due" type="date" value="${i.due||''}"></label></div>
    <div class="actions">${edit?'<button class="btn danger" id="i-del">Delete</button>':'<span></span>'}<span><button class="btn" id="i-cancel">Cancel</button> <button class="btn primary" id="i-save">${edit?'Save changes':'Create invoice'}</button></span></div></div>`);
  $('#i-proj').onchange=e=>{ const p=D.projects.find(x=>x.id===e.target.value); if(p&&!$('#i-client').value) $('#i-client').value=p.client||''; };
  $('#i-cancel').onclick=closeSheet;
  $('#i-save').onclick=async()=>{ const row={id:i.id,number:$('#i-num').value.trim(),project_id:$('#i-proj').value||null,client:$('#i-client').value.trim()||null,amount:Number($('#i-amt').value)||0,issued:$('#i-issued').value||today(),due:$('#i-due').value||null,status:$('#i-status').value};
    if(!row.number) return toast('Enter an invoice number'); closeSheet(); await save(()=>DB.upsert('invoices',row),edit?'Saved':'Invoice created'); };
  if(edit) $('#i-del').onclick=async()=>{ if(confirm('Delete this invoice?')){ closeSheet(); await save(()=>DB.remove('invoices',i.id),'Deleted'); } };
}

boot();
</script>
